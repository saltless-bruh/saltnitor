; Sanitized copy of the operator's working router.ini (c89f278 era). REQ-MIG-004.
; ${MODELS_DIR} = the models root; ${HOME} = the user's home.
; router.ini — llama.cpp native-router model presets (Saltcode Phase-2 tiers)
; =========================================================================
; Launch:
;   llama-server --models-preset ${MODELS_DIR}/llama.cpp/router.ini \
;                --models-max 1 --host 127.0.0.1 --port 8080
;
; Each [SECTION] name is the model id callers put in the OpenAI "model" field:
;   {"model": "A_STD"} / {"model": "A_FOCUS"} / {"model": "B"}
; Keys are llama-server CLI flags WITHOUT the leading dashes (short or long).
; --models-max 1 → one model resident at a time; loading one evicts the other.
;
; DO NOT put host / port / alias here — the router force-overrides control args
; (it drops them with a warning).
;
; ⚠️ VERIFY-ON-YOUR-BUILD (this feature is young and not fully standardized):
;   1. Only WHITELISTED options are accepted in presets (see preset.cpp in your
;      build). The standard memory/sampling keys below are safe; the two flagged
;      "(verify)" keys — override-tensor and any speculative/MTP flags — may not
;      be whitelisted yet (cf. ggml-org/llama.cpp issue #20851).
;   2. PER-MODEL ctx-size / n-gpu-layers overrides are not honored on every build
;      (same issue). If A_FOCUS doesn't actually get 256K (check GET /props after
;      loading it), set ctx-size globally on the router CLI, or use llama-swap.
;   3. If override-tensor is NOT preset-whitelisted, Tier B's expert-offload can't
;      be expressed here. Use llama-swap for B (it spawns a process per model with
;      full flag control) — Saltnitor's control API sits in front of either, you
;      only change router_base.

[*]
; ---- global defaults, applied to every section unless overridden ----
flash-attn   = on
threads      = 7            ; cores-1 on the Ryzen 7 7700 (leave one for OS/GPU sched)
cache-reuse  = 256          ; reuse prompt cache in 256-tok chunks across agent turns
ubatch-size  = 1024         ; prefill throughput ~870 tok/s (the agent-latency lever)
batch-size   = 2048
cache-type-k = q8_0
cache-type-v = q8_0
ngl          = 99           ; n-gpu-layers; short form, matches your original router.ini

[A_STD]
; Tier A default — 9B fully in VRAM, fast path for low/medium tasks
model        = ${MODELS_DIR}/llama.cpp/models/Qwen3.5-9B-MTP-UD-Q5_K_XL.gguf
ctx-size     = 65536
; load-on-startup = true     ; re-enable once your model path is confirmed (auto-loads A_STD at boot)
; spec-type / draft flags: add YOUR build's actual speculative-decoding flags here
; after verifying them (Qwen3.5-dense MTP is finicky — benchmark before relying on it).

[A_FOCUS]
; Tier A long-context variant — same gguf, large context (see caveat #2 above)
model        = ${MODELS_DIR}/llama.cpp/models/Qwen3.5-9B-MTP-UD-Q5_K_XL.gguf
ctx-size     = 262144
ubatch-size  = 512           ; long ctx already pressures VRAM
stop-timeout = 300           ; unload after 5 min idle (rarely used)

[B]
; Tier B escalation — hybrid CPU-offload MoE
model        = ${MODELS_DIR}/llama.cpp/models/Qwen3.6-35B-A3B-MTP-UD-Q4_K_XL.gguf
; REAP-pruned alt (near-lossless on code, ~3-4 GB lighter RAM — verify exact repo):
; model      = ${MODELS_DIR}/llama.cpp/models/Qwen3.6-28B-REAP20-A3B-UD-Q4_K_XL.gguf
override-tensor = .ffn_.*_exps.=CPU   ; (verify) experts → RAM; attention + KV stay on GPU
ctx-size     = 65536
stop-timeout = 120           ; unload after 2 min idle to free RAM back for Tier A
; spec-type / draft flags: Qwen3.6 MTP is stable — add your build's flags after verifying.
